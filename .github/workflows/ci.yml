name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported runtime and the current one. Teslon runs on
        # whatever a team's CI already has, so both have to stay green.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # Teslon's own tests exercise merge-base resolution, which needs
          # more than the default shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Proving ground (OrderDesk, 31 real PRs, truth written first)
        # A silent miss, a wrong skip, a false alarm, noise, a wrong range or unsafe
        # output on any scenario fails the build: Teslon stands on trust.
        run: node bench/proving-ground/run.mjs --out proving-ground.md && cat proving-ground.md >> "$GITHUB_STEP_SUMMARY"

      - name: Probe catalog (one real PR per kind of change, truth written first)
        # The perfection gates (research/PERFECTION-RULES-2026-11-04.md): any silent
        # miss, wrong skip, unsaid risk, failed citation or crash fails the build.
        run: node bench/probes/run.mjs --md probes.md && cat probes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Probe catalog on ShopFlow (Kafka, mappers, Vue)
        run: node bench/probes/run.mjs --app shopflow --md probes-shopflow.md && cat probes-shopflow.md >> "$GITHUB_STEP_SUMMARY"

      - name: Skip checker soundness (every truth-reached area, handed over as if skipped)
        # The independent checker (packages/core/src/engine/certify.ts) must refuse each one, through code
        # the area runs or as content it relies on. One it would certify with nothing to show fails the build.
        run: set -o pipefail; node bench/probes/certscan.mjs --app=shopflow --truth | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Invariants must be covered, not merely passing
        run: |
          # A green suite that stopped asserting the invariants is worse than
          # a red one, because it looks like a guarantee.
          for inv in "I1 ·" "I2 ·" "I3 ·" "I4 ·"; do
            grep -q "$inv" packages/core/test/*.test.mjs \
              || { echo "::error::no test asserts invariant $inv"; exit 1; }
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high

  # The Action itself, end to end on this PR: build, place the PR on main,
  # write the summary and artifact. No comment on Teslon's own PRs.
  action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          comment: 'false'

  # The mutation gauntlet (bench/gauntlet, research/GAUNTLET-2026-11-05.md): both fixtures compiled with javac,
  # then a compile-proven behaviour mutant per method, every endpoint path and controller prefix moved, and a
  # comment inside every method. The truth is the bytecode oracle's, not Teslon's. A wrong skip, a silent area,
  # a failed citation, a crash or a comment-only mutant listed to test fails the build.
  gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci && npm run build
      - name: Compile the fixtures
        run: |
          bash bench/gauntlet/build.sh orderdesk "$RUNNER_TEMP/od"
          bash bench/gauntlet/build.sh shopflow "$RUNNER_TEMP/sf"
      - name: Make the mutants and run Teslon on each
        run: |
          set -eo pipefail
          for app in orderdesk:od shopflow:sf; do
            a=${app%%:*}; d="$RUNNER_TEMP/${app##*:}"
            for k in behaviour route comment; do
              node bench/gauntlet/mutate.mjs --kind $k $a "$d" "$RUNNER_TEMP/$a-$k.json"
              node bench/gauntlet/run.mjs "$RUNNER_TEMP/$a-$k.json" | tail -1 | sed "s/^/$a $k: /" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
