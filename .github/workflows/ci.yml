name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported runtime and the current one. Teslon runs on
        # whatever a team's CI already has, so both have to stay green.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # Teslon's own tests exercise merge-base resolution, which needs
          # more than the default shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Proving ground (OrderDesk, 31 real PRs, truth written first)
        # A silent miss, a wrong skip, a false alarm, noise, a wrong range or unsafe
        # output on any scenario fails the build: Teslon stands on trust.
        run: node bench/proving-ground/run.mjs --out proving-ground.md && cat proving-ground.md >> "$GITHUB_STEP_SUMMARY"

      - name: Probe catalog (one real PR per kind of change, truth written first)
        # The perfection gates (research/PERFECTION-RULES-2026-11-04.md): any silent
        # miss, wrong skip, unsaid risk, failed citation or crash fails the build.
        run: node bench/probes/run.mjs --md probes.md && cat probes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Invariants must be covered, not merely passing
        run: |
          # A green suite that stopped asserting the invariants is worse than
          # a red one, because it looks like a guarantee.
          for inv in "I1 ·" "I2 ·" "I3 ·" "I4 ·"; do
            grep -q "$inv" packages/core/test/*.test.mjs \
              || { echo "::error::no test asserts invariant $inv"; exit 1; }
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high

  # The Action itself, end to end on this PR: build, place the PR on main,
  # write the summary and artifact. No comment on Teslon's own PRs.
  action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          comment: 'false'
