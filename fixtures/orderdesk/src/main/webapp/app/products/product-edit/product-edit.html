<h2>{{ product() ? 'Edit product' : 'New product' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <label for="sku">SKU</label>
  <input id="sku" formControlName="sku" />
  <label for="pname">Name</label>
  <input id="pname" formControlName="name" />
  <label for="price">Price</label>
  <input id="price" type="number" step="0.01" formControlName="price" />
  <label for="stock">Stock</label>
  <input id="stock" type="number" formControlName="stock" />
  <label><input type="checkbox" formControlName="active" /> Active</label>
  <button type="submit" [disabled]="form.invalid">Save</button>
</form>
